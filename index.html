<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e12;
            --container-bg: rgba(20, 22, 30, 0.6);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
        }

        /* The canvas that Bevy mounts to */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Loading Screen Overlay */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #161925;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        #loader.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .loader-card {
            background: var(--container-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }


        .loader-content {
            position: relative;
            z-index: 1;
        }

        /* Vector Arena Game Title */
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 8px;
            background: #ffffff;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
        }

        .subtitle {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-bottom: 32px;
            text-transform: uppercase;
        }

        /* Spinner Animation */
        .spinner-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 36px;
        }

        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffffff;
            animation: spin 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Gameplay HUD Controls Overlay */
        .controls-overlay {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(20, 22, 30, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            pointer-events: none;
            /* Let gameplay clicks pass through the overlay */
            transition: opacity 0.5s ease;
        }

        .controls-overlay h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .controls-overlay ul {
            list-style: none;
            padding-left: 0;
        }

        .controls-overlay li {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-overlay li:last-child {
            margin-bottom: 0;
        }

        .controls-overlay strong {
            color: #ffffff;
        }

        /* Loading Text */
        .loading-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.05em;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
                filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.5));
            }
        }
    </style>
</head>

<body>
    <!-- Bevy will automatically find this canvas or append one if not present, but having it styled explicitly makes it robust -->
    <canvas id="bevy-canvas"></canvas>

    <div id="loader">
        <div class="loader-card">
            <div class="loader-content">
                <h1>Vector Arena</h1>
                <div class="spinner-container">
                    <div class="spinner-ring"></div>
                </div>

                <div class="loading-text">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Prevent right-click context menu so Right Click excavation feels native -->
    <script>
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        window.addEventListener('TrunkApplicationStarted', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if (loader) loader.classList.add('fade-out');
            }, 500);
        });
    </script>
    <link data-trunk rel="rust" href="crates/vector-arena/Cargo.toml" data-bin="game" />
    <div class="controls-overlay">
        <h3>Controls</h3>
        <ul>
            <li><strong>Left-Click</strong> or <strong>G</strong>: Move</li>
            <li><strong>Z</strong>: Zap magic missile</li>
            <!--<li><strong>Right-Click</strong>: Crumble terrain</li>-->
            <li><strong>Q</strong>: Quaff potion</li>
            <li><strong>R</strong>: Read scroll</li>
            <li><strong>D</strong>: Descend</li>
            <!--<li><strong>O</strong> twice: Connect two things with rope</li>-->
        </ul>
    </div>
</body>

</html>
