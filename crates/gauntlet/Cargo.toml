[package]
name = "gauntlet"
version = "0.1.0"
edition = "2024"
default-run = "gauntlet"

[[bin]]
name = "gauntlet"
path = "src/main.rs"

[dependencies]
rogue-angles = { path = "../rogue-angles" }
bevy = { version = "0.18.1", default-features = false, features = ["2d"] }
avian2d = { version = "0.5" }
geo = "0.32"
rand = "0.8"
bevy_landmass = "0.11.1"
bevy_egui = "0.39.1"

# Build profiles live in the workspace root manifest — Cargo ignores
# `[profile.*]` in non-root members.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["default_platform"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "std",
    "bevy_winit",
    "default_font",
    "webgl2",
] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
