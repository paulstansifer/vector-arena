[package]
name = "vector-arena"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", features = ["dev"] }
avian2d = "0.5"
bevy_mesh = "0.18"
geo = "0.32"
rand = "0.8"
vleue_navigator = { version = "0.15", features = [
    "avian2d",
    "debug-with-gizmos",
] } # needs avian2d to be 0.5

[profile.dev]
opt-level = 1 # Suggested by the Bevy docs

[profile.dev.package."*"]
opt-level = 3 # Suggested by the Bevy docs
