[workspace]
resolver = "3"
members = ["crates/rogue-angles", "crates/vector-arena"]
# `bevy_verlet` is a vendored third-party fork consumed as a plain path
# dependency. Keeping it out of the workspace means its example-only
# dev-dependencies (bevy_pbr, x11, tonemapping LUTs, …) are never built, which
# matches how it was consumed before the workspace split.
exclude = ["crates/bevy_verlet"]
# Bare `cargo run` / `cargo build` should still mean "the game".
default-members = ["crates/vector-arena"]

# Profiles only take effect at the workspace root; these moved here verbatim
# from the pre-split vector-arena manifest.
[profile.dev]
opt-level = 1 # Suggested by the Bevy docs

[profile.dev.package."*"]
opt-level = 3              # Suggested by the Bevy docs
debug = "line-tables-only" # Let's try to save some disk space

[profile.release]
opt-level = "s"   # Optimize for size
lto = true
codegen-units = 1
