[package]
name = "vector-arena"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", features = ["dev"] }
avian2d = "0.6"
bevy_mesh = "0.18"
geo = "0.33.1"
rand = "0.8"

[profile.dev]
opt-level = 1 # Suggested by the Bevy docs

[profile.dev.package."*"]
opt-level = 3 # Suggested by the Bevy docs
